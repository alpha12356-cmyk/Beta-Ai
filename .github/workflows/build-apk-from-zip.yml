name: Build Beta APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Extract Beta Android project
        run: |
          mkdir -p /tmp/beta
          unzip -q BetaV5_Phone_Build.zip -d /tmp/beta

      - name: Create JVM compatibility fix
        run: |
          cat > /tmp/fix-jvm.gradle <<'EOF'
          allprojects {
            afterEvaluate {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                sourceCompatibility = "17"
                targetCompatibility = "17"
                options.release.set(17)
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = "17"
              }
            }
          }
          EOF

      - name: Build debug APK
        working-directory: /tmp/beta/BetaV5_Android_Connected/android
        run: |
          gradle --init-script /tmp/fix-jvm.gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beta-debug-apk
          path: /tmp/beta/BetaV5_Android_Connected/android/app/build/outputs/apk/debug/app-debug.apk                sourceCompatibility = "17"
                targetCompatibility = "17"
                options.release.set(17)
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = "17"
              }
            }
          }
          EOF

      - name: Build debug APK
        working-directory: /tmp/beta/BetaV5_Android_Connected/android
        run: |
          gradle --init-script /tmp/fix-jvm.gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beta-debug-apk
          path: /tmp/beta/BetaV5_Android_Connected/android/app/build/outputs/apk/debug/app-debug.apk        uses: actions/upload-artifact@v4
        with:
          name: Beta-debug-apk
          path: /tmp/beta/BetaV5_Android_Connected/android/app/build/outputs/apk/debug/app-debug.apk            {} \;

      - name: Build debug APK
        working-directory: /tmp/beta/BetaV5_Android_Connected/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beta-debug-apk
          path: /tmp/beta/BetaV5_Android_Connected/android/app/build/outputs/apk/debug/app-debug.apk
